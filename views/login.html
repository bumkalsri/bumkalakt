<div class="fixed inset-0 w-full h-full flex items-center justify-center p-4 bg-cover bg-center bg-no-repeat overflow-hidden" style="background-image: url('./assets/img/wallpaper.png');">
    <div class="bg-white/95 backdrop-blur-sm w-full max-w-md border border-slate-200 shadow-xl p-8 space-y-6">
        
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-bold text-slate-800 tracking-wide">AKUNTANSI PWA</h1>
            <p class="text-sm text-slate-500">Silakan masuk menggunakan akun Google Anda</p>
        </div>

        <div id="login-error" class="hidden bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 text-xs"></div>

        <div class="space-y-4 pt-2">
            <button type="button" id="btn-google-login" class="w-full flex items-center justify-center gap-3 bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 py-3 text-sm font-medium transition-colors shadow-sm cursor-pointer">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.2 21.32 7.28 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.12 0 9.87 0 12s.43 3.88 1.19 5.42l4.09-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.28 0 3.2 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                </svg>
                <span>Masuk dengan Akun Google</span>
            </button>
        </div>

        <div class="text-center pt-4 border-t border-slate-100">
            <p class="text-xs text-slate-500">BUMKal Sinar Mitra Desa &copy; 2026</p>
        </div>
    </div>
</div>

<script type="module">
    import { auth } from '../assets/js/firebase-config.js';
    import { GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const btnGoogle = document.getElementById('btn-google-login');
    const errorBox = document.getElementById('login-error');

    if (btnGoogle) {
        btnGoogle.addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            errorBox.classList.add('hidden');
            btnGoogle.disabled = true;

            try {
                const result = await signInWithPopup(auth, provider);
                if (result.user) {
                    window.location.hash = '#dashboard';
                }
            } catch (error) {
                console.error("Google Login Error:", error);
                errorBox.textContent = "Gagal Masuk: " + error.message;
                errorBox.classList.remove('hidden');
                btnGoogle.disabled = false;
            }
        });
    }
</script>
