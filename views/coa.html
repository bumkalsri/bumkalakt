<div class="space-y-6">
    <!-- Header & Tombol Tambah -->
    <div class="bg-white p-6 border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
            <h1 class="text-xl font-bold text-slate-800">Master Akun (Chart of Accounts / COA)</h1>
            <p class="text-sm text-slate-500 mt-0.5">Kelola daftar akun perkiraan untuk pencatatan akuntansi</p>
        </div>
        <button onclick="openModalTambahAkun()" class="bg-primary hover:bg-blue-700 text-white px-4 py-2 text-sm font-medium transition-colors">
            + Tambah Akun Baru
        </button>
    </div>

    <!-- Tabel Daftar Akun -->
    <div class="bg-white border border-slate-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="bg-slate-100 border-b border-slate-200 text-slate-700 uppercase text-xs tracking-wider">
                        <th class="p-3.5 font-semibold">Kode Akun</th>
                        <th class="p-3.5 font-semibold">Nama Akun</th>
                        <th class="p-3.5 font-semibold">Jenis / Kategori</th>
                        <th class="p-3.5 font-semibold">Posisi Normal</th>
                        <th class="p-3.5 font-semibold text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-coa-body" class="divide-y divide-slate-200">
                    <tr>
                        <td colspan="5" class="p-6 text-center text-slate-500">Memuat data akun dari Firebase...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Form Tambah Akun (Kotak Siku & Clean White) -->
<div id="modal-akun" class="fixed inset-0 bg-slate-900/50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md border border-slate-200 shadow-xl p-6 space-y-4">
        <h3 class="text-lg font-bold text-slate-800" id="modal-title">Tambah Akun Baru</h3>
        
        <form id="form-akun" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Kode Akun</label>
                <input type="text" id="kode_akun" required placeholder="Contoh: 11100" class="w-full border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-primary">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nama Akun</label>
                <input type="text" id="nama_akun" required placeholder="Contoh: Kas Utama" class="w-full border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-primary">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Kategori Akun</label>
                <select id="kategori_akun" class="w-full border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:border-primary">
                    <option value="Aktiva">Aktiva (Asset)</option>
                    <option value="Kewajiban">Kewajiban (Liability)</option>
                    <option value="Ekuitas">Ekuitas (Equity)</option>
                    <option value="Pendapatan">Pendapatan (Revenue)</option>
                    <option value="Beban">Beban / Biaya (Expense)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Posisi Normal</label>
                <select id="posisi_normal" class="w-full border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:border-primary">
                    <option value="Debit">Debit</option>
                    <option value="Kredit">Kredit</option>
                </select>
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t border-slate-200">
                <button type="button" onclick="closeModalTambahAkun()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 text-sm font-medium">Batal</button>
                <button type="submit" class="bg-primary hover:bg-blue-700 text-white px-4 py-2 text-sm font-medium">Simpan Akun</button>
            </div>
        </form>
    </div>
</div>

<script>
    // Fungsi pengendali modal COA sederhana
    window.openModalTambahAkun = function() {
        document.getElementById('modal-akun').classList.remove('hidden');
    }
    window.closeModalTambahAkun = function() {
        document.getElementById('modal-akun').classList.add('hidden');
    }
</script>
