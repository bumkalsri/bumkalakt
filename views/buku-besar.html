<div class="space-y-6">
    <div class="bg-white p-6 border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
            <h1 class="text-xl font-bold text-slate-800">Buku Besar (General Ledger)</h1>
            <p class="text-sm text-slate-500 mt-0.5">Rincian mutasi transaksi berdasarkan perkiraan akun</p>
        </div>
        <div class="flex items-center gap-2">
            <select id="filter-akun-bb" class="border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:border-primary">
                <option value="">-- Pilih Akun Buku Besar --</option>
            </select>
        </div>
    </div>

    <div class="bg-white border border-slate-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="bg-slate-100 border-b border-slate-200 text-slate-700 uppercase text-xs tracking-wider">
                        <th class="p-3.5 font-semibold">Tanggal</th>
                        <th class="p-3.5 font-semibold">No. Bukti</th>
                        <th class="p-3.5 font-semibold">Keterangan</th>
                        <th class="p-3.5 font-semibold text-right">Debit</th>
                        <th class="p-3.5 font-semibold text-right">Kredit</th>
                        <th class="p-3.5 font-semibold text-right">Saldo</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                    <tr>
                        <td colspan="6" class="p-6 text-center text-slate-500">Silakan pilih akun perkiraan terlebih dahulu.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
