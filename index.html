<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Akuntansi - SPA PWA</title>
    
    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="./assets/img/icon-192.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        dark: '#1e293b'
                    }
                }
            }
        }
    </script>
    
    <!-- Custom Style (Kotak Siku & Clean White) -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col min-h-screen">

    <!-- APP SHELL CONTAINER -->
    <div id="app" class="flex flex-col md:flex-row flex-1 min-h-screen">
        
        <!-- SIDEBAR DESKTOP (Ditambahkan kelas transisi untuk fitur toggle buka-tutup) -->
        <aside id="desktop-sidebar-container" class="hidden md:flex md:w-64 bg-white border-r border-slate-200 flex-col shrink-0 transition-all duration-300 ease-in-out">
            <!-- Dimuat dinamis via router.js -->
        </aside>

        <!-- MAIN CONTENT AREA -->
        <div class="flex-1 flex flex-col min-w-0">
            
            <!-- HEADER MOBILE / TOPBAR DESKTOP -->
            <header id="header-container" class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-4 sticky top-0 z-30">
                <!-- Dimuat dinamis via router.js -->
            </header>

            <!-- VIEW DYNAMIC CONTENT CONTAINER -->
            <main id="app-view" class="flex-1 p-4 md:p-6 pb-20 md:pb-6 overflow-y-auto">
                <!-- Konten halaman SPA akan dirender di sini -->
                <div class="flex items-center justify-center h-64">
                    <div class="text-center">
                        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary border-t-transparent"></div>
                        <p class="mt-2 text-sm text-slate-500">Memuat Aplikasi...</p>
                    </div>
                </div>
            </main>

        </div>
    </div>

    <!-- BOTTOM NAVIGATION (Visible only on Mobile HP) -->
    <nav id="mobile-nav-container" class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-40">
        <!-- Dimuat dinamis via router.js -->
    </nav>

    <!-- Global Scripts -->
    <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
